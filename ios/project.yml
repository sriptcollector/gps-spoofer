# xcodegen spec for the iPhone app. CI generates GPSSpoofer.xcodeproj from this and ships it
# inside the Mac app, which builds it on the user's Mac with their own Apple team.
# Vendor/IDevice.xcframework is fetched by the Mac app (or scripts/fetch-idevice.sh), not committed.
name: GPSSpoofer
options:
  bundleIdPrefix: ai.toolbay
  deploymentTarget: {iOS: "17.0"}
settings:
  CODE_SIGN_STYLE: Automatic
  SWIFT_VERSION: "5.0"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  GPSSpoofer:
    type: application
    platform: iOS
    scheme: {}
    sources: [GPSSpoofer]
    dependencies:
      - framework: Vendor/IDevice.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ai.toolbay.gpsspoofer
      PRODUCT_NAME: GPSSpoofer
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: GPSSpoofer/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1"
