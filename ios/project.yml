# xcodegen spec for the iPhone app. scripts/build-ipa.sh (CI) compiles it unsigned into GPSSpoofer.ipa,
# which ships inside the Mac app; the Mac app signs it with the user's Apple ID when installing.
# Vendor/IDevice.xcframework comes from scripts/fetch-idevice.sh, not committed.
name: GPSSpoofer
options:
  bundleIdPrefix: ai.toolbay
  deploymentTarget: {iOS: "17.0"}
settings:
  CODE_SIGN_STYLE: Automatic
  SWIFT_VERSION: "5.0"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  GPSSpoofer:
    type: application
    platform: iOS
    scheme: {}
    sources: [GPSSpoofer]
    dependencies:
      - framework: Vendor/IDevice.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ai.toolbay.gpsspoofer
      PRODUCT_NAME: GPSSpoofer
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: GPSSpoofer/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1"
